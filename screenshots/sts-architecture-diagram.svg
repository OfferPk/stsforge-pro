<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="boxGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0e4459" />
    </linearGradient>
    <linearGradient id="boxGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,60 L 960,60 M 0,120 L 960,120 M 0,180 L 960,180 M 0,240 L 960,240 M 0,300 L 960,300 M 0,360 L 960,360 M 0,420 L 960,420 M 0,480 L 960,480" />
    <path d="M 120,0 L 120,540 M 240,0 L 240,540 M 360,0 L 360,540 M 480,0 L 480,540 M 600,0 L 600,540 M 720,0 L 720,540 M 840,0 L 840,540" />
  </g>

  <!-- Title Section -->
  <text x="480" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    STSFORGE PRO — CCSDS 855.0-M-1 ARCHITECTURE
  </text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    SPACECRAFT ONBOARD INTERFACE SERVICES (SOIS) — SUBNETWORK TEST SERVICE
  </text>

  <!-- Layer 1: Flight Software / Test Equipment -->
  <rect x="100" y="100" width="760" height="60" rx="8" fill="url(#boxGrad1)" stroke="#334155" stroke-width="2" />
  <text x="480" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">
    Spacecraft Flight Software (FSW) / Ground EGSE &amp; Avionics Test Benches
  </text>
  <text x="480" y="146" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    Mission Applications • FDIR Supervisors • Telemetry/Command Handlers
  </text>

  <!-- Primitives Arrows -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <!-- Downward: TEST.request -->
    <path d="M 320,160 L 320,200" />
    <!-- Upward: TEST.indication -->
    <path d="M 520,200 L 520,160" />
    <!-- Upward: TEST_FAILURE.indication -->
    <path d="M 680,200 L 680,160" />
  </g>
  <text x="320" y="185" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="end" dx="-8">TEST.request</text>
  <text x="520" y="185" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="start" dx="8">TEST.indication</text>
  <text x="680" y="185" font-family="monospace" font-size="10" fill="#f87171" text-anchor="start" dx="8">TEST_FAILURE.ind</text>

  <!-- Layer 2: STS Core Service -->
  <rect x="100" y="200" width="760" height="110" rx="8" fill="url(#boxGradCyan)" stroke="#0284c7" stroke-width="2" />
  <text x="120" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#38bdf8">
    SOIS Subnetwork Test Service (STS) Layer (CCSDS 855.0-M-1)
  </text>

  <!-- Service Submodules -->
  <rect x="120" y="240" width="220" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="230" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">PRBS-9 Generator</text>
  <text x="230" y="280" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">x⁹ + x⁵ + 1 (511-bit LFSR)</text>

  <rect x="370" y="240" width="220" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="480" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">RTT Latency Engine</text>
  <text x="480" y="280" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Microsecond Resolution</text>

  <rect x="620" y="240" width="220" height="55" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1.5" />
  <text x="730" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">BER &amp; Bit Comparator</text>
  <text x="730" y="280" font-family="monospace" font-size="10" fill="#facc15" text-anchor="middle">Hamming Distance Check</text>

  <!-- Layer 3: SSCL Convergence & Transceivers -->
  <rect x="100" y="340" width="760" height="70" rx="8" fill="url(#boxGrad1)" stroke="#334155" stroke-width="2" />
  <text x="480" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">
    Subnetwork Specific Convergence Layer (SSCL) &amp; Transceiver Adapters
  </text>
  <g font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">
    <text x="230" y="390">SpaceWire (PID 0x03)</text>
    <text x="480" y="390">MIL-STD-1553B (SA 30)</text>
    <text x="730" y="390">CANopen (COB-ID 0x7E0)</text>
  </g>

  <!-- Layer 4: Physical Buses & Endpoints -->
  <g>
    <!-- Node 1: SpaceWire Payload Mass Memory -->
    <rect x="100" y="440" width="220" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="210" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Payload Mass Memory</text>
    <text x="210" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Addr: 0x1A • SpW Loopback</text>

    <!-- Node 2: Star Tracker A -->
    <rect x="370" y="440" width="220" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="480" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Star Tracker A</text>
    <text x="480" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Addr: 0x22 • 1553B Subaddr 30</text>

    <!-- Node 3: Power Distribution Unit -->
    <rect x="640" y="440" width="220" height="65" rx="6" fill="url(#boxGradGreen)" stroke="#10b981" stroke-width="1.5" />
    <text x="750" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5" text-anchor="middle">Power Distribution Unit</text>
    <text x="750" y="482" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Addr: 0x34 • CAN Diagnostic</text>
  </g>

  <!-- Connectors -->
  <line x1="210" y1="410" x2="210" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="480" y1="410" x2="480" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="750" y1="410" x2="750" y2="440" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <line x1="480" y1="310" x2="480" y2="340" stroke="#38bdf8" stroke-width="2" />
</svg>
